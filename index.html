<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Weather Alert</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#e8f4fd;--surface:#ffffff;--surface2:#f0f6ff;--surface3:#e3eeff;
  --border:#b6d4f2;--border2:#8ab4e0;
  --text:#1a2b3a;--text2:#3a5a7a;--text3:#7a95b0;
  --accent:#3b82f6;--accent2:#6366f1;--accent-glow:rgba(59,130,246,.10);
  --red:#dc2626;--red-bg:rgba(220,38,38,.06);--red-border:rgba(220,38,38,.15);
  --green:#16a34a;--green-bg:rgba(22,163,74,.06);--green-border:rgba(22,163,74,.15);
  --orange:#d97706;--orange-bg:rgba(217,119,6,.06);--orange-border:rgba(217,119,6,.15);
  --radius:14px;--radius2:10px;
  --font:'Inter','Segoe UI','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Cascadia Code','Fira Code',monospace;
  --ease:cubic-bezier(.4,0,.2,1);--bounce:cubic-bezier(.34,1.56,.64,1);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(59,130,246,.07) 0%,transparent 60%),
             radial-gradient(ellipse 60% 50% at 85% 80%,rgba(139,92,246,.05) 0%,transparent 60%);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;
  background-image:radial-gradient(rgba(60,100,160,.06) 1px,transparent 1px);
  background-size:24px 24px;pointer-events:none;z-index:0}
.container{max-width:1520px;margin:0 auto;padding:16px 24px;position:relative;z-index:1}

/* === SCROLLBAR === */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}

/* === HEADER === */
.header{padding:0 0 16px;margin-bottom:16px;animation:fadeDown .5s var(--ease)}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:12px}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 20px rgba(59,130,246,.3);animation:logoPulse 3s ease-in-out infinite}
.logo h1{font-size:17px;font-weight:800;letter-spacing:-.4px;background:linear-gradient(135deg,var(--text),var(--text2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo h1 small{display:block;font-size:11px;font-weight:500;margin-top:1px;-webkit-text-fill-color:var(--text3)}
.header-main-ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.header-sub{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border)}
.header-sub-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.header-sub-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* === BUTTONS === */
.btn{padding:6px 14px;border:none;border-radius:var(--radius2);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s var(--ease);display:inline-flex;align-items:center;gap:5px;font-family:var(--font);position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent);opacity:0;transition:opacity .2s}
.btn:hover::after{opacity:1}
.btn:active{transform:scale(.95);transition-duration:.08s}
.btn-scan{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 16px rgba(59,130,246,.3);padding:6px 18px}
.btn-scan:hover{box-shadow:0 6px 28px rgba(59,130,246,.45);transform:translateY(-1px)}
.btn-scan:disabled{opacity:.3;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);background:var(--surface2)}
.btn-lang{background:var(--surface);color:var(--accent);border:1px solid var(--border);font-weight:800;font-size:11px;letter-spacing:.5px;min-width:36px;justify-content:center;padding:6px 10px}
.btn-lang:hover{background:var(--accent-glow);border-color:var(--accent)}
.btn-auto{font-size:11px}
.btn-auto.on{background:var(--green-bg);color:var(--green);border-color:var(--green-border);animation:autoGlow 2s ease-in-out infinite}
@keyframes autoGlow{0%,100%{box-shadow:0 0 0 rgba(34,197,94,0)}50%{box-shadow:0 0 12px rgba(34,197,94,.15)}}

/* === INPUTS === */
.input-group{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:0 10px;transition:all .2s var(--ease)}
.input-group:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.input-group label{font-size:11px;color:var(--text3);white-space:nowrap;font-weight:500}
.input-group input[type="number"]{width:50px;padding:6px 2px;background:transparent;border:none;color:var(--orange);font-size:13px;font-weight:800;text-align:center;outline:none;font-family:var(--mono)}
.input-group span{font-size:11px;color:var(--text3);font-weight:500}
.input-group input[type="date"]{width:138px;padding:5px 4px;background:transparent;border:none;color:var(--text);font-size:12px;font-weight:600;outline:none;cursor:pointer;color-scheme:dark;font-family:var(--font)}
.font-size-group .btn{font-size:14px;font-weight:800;padding:6px 8px;min-width:auto}

/* === QUICK DATES === */
.quick-dates{display:flex;gap:4px;margin-left:4px}
.qdate{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text3);border:1px solid transparent;transition:all .15s var(--ease);font-family:var(--font)}
.qdate:hover{color:var(--text);background:var(--surface2);transform:translateY(-1px)}
.qdate.on{background:var(--accent-glow);color:var(--accent);border-color:rgba(59,130,246,.2);box-shadow:0 2px 8px rgba(59,130,246,.1)}

/* === STATS === */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;animation:fadeUp .5s var(--ease) .1s both}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;transition:all .25s var(--ease);position:relative;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.stat::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 60%,rgba(255,255,255,.01));pointer-events:none}
.stat::after{content:'';position:absolute;top:-20px;right:-20px;width:60px;height:60px;border-radius:50%;opacity:.04}
.stat:nth-child(1)::after{background:var(--accent)}.stat:nth-child(2)::after{background:var(--text)}.stat:nth-child(3)::after{background:var(--red)}.stat:nth-child(4)::after{background:var(--green)}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2);border-color:var(--border2)}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;font-weight:600}
.stat-val{font-size:24px;font-weight:900;font-family:var(--mono);transition:all .4s var(--ease)}
.stat-val.c1{color:var(--accent)}.stat-val.c2{color:var(--text)}.stat-val.c3{color:var(--red)}.stat-val.c4{color:var(--green)}
.stat-val.pop{transform:scale(1.12)}

/* === PROGRESS === */
.progress{height:3px;background:var(--surface);border-radius:2px;margin-bottom:16px;overflow:hidden;opacity:0;transition:opacity .3s var(--ease)}
.progress.on{opacity:1}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent),var(--green),var(--accent));background-size:300% 100%;animation:gradient 3s linear infinite;border-radius:2px;transition:width .4s var(--ease)}
@keyframes gradient{0%{background-position:0% 50%}100%{background-position:300% 50%}}

/* === MAIN GRID === */
.main-grid{display:grid;grid-template-columns:58% 1fr;gap:16px;animation:fadeUp .4s var(--ease)}
.left-panel{display:flex;flex-direction:column;gap:0;height:100%}
.left-panel .toolbar{margin-bottom:10px}
.right-panel{display:flex;flex-direction:column;gap:12px;height:100%}

/* === ALERTS === */
.alert-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 16px;position:relative;overflow:hidden;overflow-y:auto;display:flex;flex-direction:column;flex:1;min-height:0;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.alert-section::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--red),var(--orange),transparent);opacity:.6}
.alert-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative;flex-shrink:0}
.alert-header .alert-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;animation:alertIconPulse 2s ease-in-out infinite;flex-shrink:0}
.alert-header .alert-icon.high{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);box-shadow:0 0 16px rgba(239,68,68,.15)}
.alert-header .alert-icon.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.2);box-shadow:0 0 16px rgba(245,158,11,.12)}
.alert-header-text h2{font-size:14px;font-weight:800;color:var(--text);line-height:1.2}
.alert-header-text small{font-size:11px;color:var(--text3);font-weight:500}
.alert-badge{margin-left:auto;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:800;font-family:var(--mono);flex-shrink:0;transition:all .3s var(--bounce)}
.alert-badge.high{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);text-shadow:0 0 8px rgba(239,68,68,.3)}
.alert-badge.warn{background:rgba(245,158,11,.1);color:var(--orange);border:1px solid rgba(245,158,11,.2)}

/* 警报列表 - 横向单行排列 */
.alert-pair-list{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;min-height:0;justify-content:flex-start}
.alert-pair-list.few-alerts{justify-content:space-evenly}
/* 每个警报：横向单行卡片 */
.alert-pair{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;opacity:0;animation:alertSlide .4s var(--ease) forwards;transition:all .2s var(--ease);position:relative;overflow:hidden}
.alert-pair::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:12px 0 0 12px}
.alert-pair.high::before{background:var(--red)}
.alert-pair.warn::before{background:var(--orange)}
.alert-pair:hover{background:var(--surface3);border-color:var(--border2);transform:translateX(2px)}
.alert-pair.high{border-color:rgba(239,68,68,.15)}
.alert-pair.warn{border-color:rgba(245,158,11,.15)}
.alert-pair.high:hover{box-shadow:0 2px 12px rgba(239,68,68,.06)}
.alert-pair.warn:hover{box-shadow:0 2px 12px rgba(245,158,11,.06)}
/* 警报内的各元素 */
.alert-flag{font-size:18px;flex-shrink:0}
.alert-city{font-size:12px;font-weight:700;color:var(--text);min-width:75px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-date{font-size:10px;color:var(--text3);white-space:nowrap;margin-right:2px}
.alert-settle{font-size:10px;font-weight:700;font-family:var(--mono);white-space:nowrap}
.alert-tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;flex-shrink:0}
.alert-tag.yes{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.alert-tag.no{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.alert-pct{font-size:15px;font-weight:900;font-family:var(--mono);flex-shrink:0;min-width:65px;text-align:right}
.alert-pct small{font-size:9px;font-weight:500;display:block;color:var(--text3)}
.alert-pair-link{padding:5px 10px;border-radius:7px;background:linear-gradient(135deg,var(--accent-glow),rgba(139,92,246,.06));color:var(--accent);text-decoration:none;font-size:10px;font-weight:700;border:1px solid rgba(59,130,246,.08);transition:all .2s var(--ease);white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:2px}
.alert-pair-link:hover{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.25);transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,.12)}
.dot-icon{flex-shrink:0;display:inline-flex;align-items:center}

.tag{padding:3px 10px;border-radius:7px;font-size:10px;font-weight:700;letter-spacing:.3px;transition:all .15s}
.tag-yes{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.tag-no{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.tag-pct{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border);font-size:10px;font-weight:800}

@keyframes alertIconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes arrowPulse{0%,100%{transform:scale(1);box-shadow:0 0 8px rgba(239,68,68,.08)}50%{transform:scale(1.15);box-shadow:0 0 16px rgba(239,68,68,.18)}}

/* === TOOLBAR === */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search-box{flex:1;min-width:180px;padding:8px 14px 8px 36px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);color:var(--text);font-size:12px;outline:none;transition:all .2s var(--ease);font-family:var(--font)}
.search-box:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none;transition:color .2s}
.search-box:focus~.ico,.search-box:focus+.ico{color:var(--accent)}
.search-box::placeholder{color:var(--text3)}
.count{font-size:11px;color:var(--text3);margin-left:auto;white-space:nowrap;font-family:var(--mono)}

/* === VOLUME RANK === */
.vol-rank{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:0;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.vol-rank-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.vol-rank-header h3{font-size:13px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:6px}
.vol-rank-header h3 .rank-ico{font-size:15px}
.vol-rank-toggle{font-size:10px;color:var(--accent);cursor:pointer;background:none;border:none;font-weight:600;font-family:var(--font);padding:2px 8px;border-radius:6px;transition:all .15s}
.vol-rank-toggle:hover{background:var(--accent-glow)}
.vol-rank-list{display:flex;flex-wrap:wrap;gap:6px 8px}
.vol-rank-item{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;transition:all .2s var(--ease);cursor:default}
.vol-rank-item:hover{border-color:var(--accent);background:var(--surface3)}
.vol-rank-num{font-size:9px;font-weight:800;color:var(--accent);font-family:var(--mono);min-width:14px;text-align:center}
.vol-rank-item:nth-child(1) .vol-rank-num{color:var(--red)}
.vol-rank-item:nth-child(2) .vol-rank-num{color:var(--orange)}
.vol-rank-item:nth-child(3) .vol-rank-num{color:#d97706}
.vol-rank-flag{font-size:13px}
.vol-rank-city{font-weight:600;color:var(--text);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vol-rank-vol{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:10px}
.vol-rank-bar{width:32px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;flex-shrink:0}
.vol-rank-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s var(--ease)}

/* === TABLE === */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:fadeUp .4s var(--ease);box-shadow:0 2px 12px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;background:var(--surface2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2;cursor:default;backdrop-filter:blur(8px)}
tbody td{padding:7px 12px;font-size:11px;border-bottom:1px solid rgba(30,45,68,.3);font-family:var(--mono);font-size:11px;transition:background .15s}
tbody tr{transition:background .12s var(--ease)}
tbody tr:hover td{background:rgba(59,130,246,.03)}
.city-row{cursor:pointer}
.city-row:hover td{background:rgba(59,130,246,.05)!important}
.city-row td{font-family:var(--font)!important;font-size:12px!important;font-weight:700;color:var(--accent);padding:9px 12px!important;background:var(--surface2);border-bottom:1px solid var(--border);transition:all .15s}
.city-row.has-alert td{color:var(--red)!important;font-weight:800;background:rgba(239,68,68,.04)!important}
.city-row.has-alert td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.city-row .chevron{transition:transform .2s var(--ease);display:inline-block;font-size:14px;color:var(--text2);cursor:pointer;padding:3px 5px;border-radius:4px}
.city-row .chevron:hover{background:var(--surface3);color:var(--text)}
.city-link{color:var(--accent);text-decoration:none;transition:all .15s var(--ease)}
.city-link:hover{opacity:.7;text-decoration:underline}
.city-row.collapsed .chevron{transform:rotate(-90deg)}
.mkt-row{max-height:40px;opacity:1;transition:max-height .25s var(--ease),opacity .2s}
.mkt-row td{padding:5px 12px 5px 20px;font-size:13px}
.bar-wrap{display:inline-flex;align-items:center;gap:5px;justify-content:flex-start}
.pct-val{font-weight:800;font-size:13px;min-width:48px;text-align:left}
.bar{height:3px;border-radius:2px;display:inline-block;min-width:2px;max-width:50px;transition:width .4s var(--ease)}
.bar-yes{background:var(--red)}.bar-no{background:var(--green)}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.status-dot.alert{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,.5);animation:pulse 1.5s ease-in-out infinite}
.status-dot.ok{background:var(--green);opacity:.4}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px rgba(239,68,68,.5)}50%{opacity:.5;box-shadow:0 0 16px rgba(239,68,68,.7)}}
.btn-trade{padding:3px 10px;border-radius:7px;background:linear-gradient(135deg,var(--accent-glow),rgba(99,102,241,.06));color:var(--accent);text-decoration:none;font-size:10px;font-weight:700;border:1px solid rgba(59,130,246,.08);transition:all .2s var(--ease);white-space:nowrap;font-family:var(--font)}
.btn-trade:hover{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.2);transform:translateY(-1px)}
.no-alert-tag{color:var(--text3);font-size:10px}

/* === EMPTY STATE === */
.empty{text-align:center;padding:80px 20px;color:var(--text3);animation:fadeUp .6s var(--ease)}
.empty-icon{font-size:52px;margin-bottom:14px;opacity:.35;animation:float 3s ease-in-out infinite}
.empty p{font-size:15px;margin-bottom:6px;font-weight:500}
.empty small{font-size:12px}

/* === TOAST === */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--radius2);font-size:13px;font-weight:700;z-index:999;opacity:0;transform:translateY(16px) scale(.95);transition:all .35s var(--bounce);pointer-events:none;max-width:400px;box-shadow:0 16px 48px rgba(0,0,0,.5);backdrop-filter:blur(16px);font-family:var(--font)}
.toast.show{opacity:1;transform:translateY(0) scale(1)}
.toast-info{background:rgba(59,130,246,.88);color:#fff}
.toast-error{background:rgba(239,68,68,.88);color:#fff}
.toast-ok{background:rgba(34,197,94,.88);color:#fff}

/* === LOG === */
.log-panel{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;max-height:120px;overflow-y:auto;font-family:var(--mono);font-size:10px;color:var(--text3);display:none;transition:all .2s var(--ease)}
.log-panel.on{display:block}
.log-line{padding:2px 0;border-bottom:1px solid rgba(30,45,68,.15);animation:fadeLeft .15s var(--ease)}
.log-line .time{color:var(--text3);margin-right:8px;opacity:.5}
.log-line .msg{color:var(--text2)}
.log-line.err .msg{color:var(--red)}

/* === SPINNER === */

/* ========== SETTLEMENT TIME ========== */
/* 计算城市本地目标日期 23:59 对应的 UTC 时间戳 */
function getSettleUTC(citySlug,year,month,day){
  var offset=TZ[citySlug]||0;
  /* 本地 23:59 → UTC：(23*60+59) - offset*60 = UTC总分钟数 */
  var totalUTCMin=(23*60+59)-offset*60;
  var utcH=Math.floor(totalUTCMin/60);
  var utcM=totalUTCMin-utcH*60;
  if(utcM<0){utcM+=60;utcH-=1}
  return new Date(Date.UTC(year,month-1,day,utcH,Math.round(utcM),0)).getTime();
}
/* 格式化剩余时间 */
function fmtRemain(ms){
  if(ms<=0)return LANG==='zh'?'已结算':'Settled';
  var h=Math.floor(ms/3600000);
  var m=Math.floor((ms%3600000)/60000);
  if(h>=24){var d=Math.floor(h/24);h=h%24;return d+'d '+h+'h'}
  if(h>0)return h+'h '+m+'m';
  return m+'m';
}
/* 获取城市本地结算时间字符串 */
function fmtSettleTime(citySlug,year,month,day){
  var offset=TZ[citySlug]||0;
  var offH=Math.floor(Math.abs(offset));
  var offM=Math.round((Math.abs(offset)-offH)*60);
  var sign=offset>=0?'+':'-';
  var tzStr='UTC'+sign+(offset<0?'':'')+(offH<10?'0':'')+offH+(offM>0?':'+offM:'');
  if(LANG==='zh'){
    return month+'月'+day+'日 23:59 ('+tzStr+')';
  }
  var mn=MONTH_NAMES[month-1];
  return mn+' '+day+', '+year+' 23:59 ('+tzStr+')';
}
/* 倒计时定时器 */
var settleTimer=null;
function startSettleTimer(){
  if(settleTimer)clearInterval(settleTimer);
  settleTimer=setInterval(updateSettleCountdown,30000);
}
function updateSettleCountdown(){
  var now=Date.now();
  var els=document.querySelectorAll('[data-settle-ts]');
  for(var i=0;i<els.length;i++){
    var ts=parseInt(els[i].getAttribute('data-settle-ts'));
    els[i].textContent=fmtRemain(ts-now);
    if(ts-now<=0)els[i].style.color='var(--green)';
    else if(ts-now<3600000)els[i].style.color='var(--red)';
    else els[i].style.color='var(--orange)';
  }
}

/* ========== ANIMATED COUNTER ========== */
function animateNum(el,target,suffix){
  suffix=suffix||'';
  var start=parseInt(el.textContent)||0;if(start===target){el.textContent=target+suffix;return}
  var diff=target-start,steps=Math.min(Math.abs(diff),20),step=0;
  var dur=350/steps;
  el.classList.add('pop');
  var iv=setInterval(function(){
    step++;var p=step/steps;
    var ease=1-Math.pow(1-p,3);
    el.textContent=Math.round(start+diff*ease)+suffix;
    if(step>=steps){clearInterval(iv);el.textContent=target+suffix;setTimeout(function(){el.classList.remove('pop')},150)}
  },dur);
}

/* ========== API ========== */
function ftFetch(url,ms){return new Promise(function(ok,no){var t=setTimeout(function(){no(new Error('timeout'))},ms);fetch(url).then(function(r){clearTimeout(t);ok(r)}).catch(function(e){clearTimeout(t);no(e)})})}
async function apiGet(url){
  var errors=[];
  /* 先尝试直接请求 */
  try{log('  直接请求...');var r=await ftFetch(url,15000);if(r.ok){log('  ✓ 直接请求成功');return r.json()}errors.push('HTTP '+r.status);log('  ✗ HTTP '+r.status,false)}
  catch(e){errors.push(e.message);log('  ✗ '+e.message,false)}
  /* 依次尝试代理，超时 20 秒 */
  for(var i=0;i<PROXIES.length;i++){
    try{
      var pu=PROXIES[i]+encodeURIComponent(url);
      log('  Proxy'+(i+1)+' ('+PROXIES[i].replace(/https?:\/\/([^/]+).*/,'$1')+')...');
      var r2=await ftFetch(pu,20000);
      if(r2.ok){log('  ✓ Proxy'+(i+1)+' 成功');return r2.json()}
      errors.push('P'+(i+1)+' '+r2.status);
      log('  ✗ Proxy'+(i+1)+' HTTP '+r2.status,false);
    }catch(e2){errors.push('P'+(i+1)+' '+e2.message);log('  ✗ Proxy'+(i+1)+' '+e2.message,false)}
  }
  /* 所有代理都失败，再重试直接请求一次 */
  try{log('  重试直接请求...');var r3=await ftFetch(url,20000);if(r3.ok){log('  ✓ 重试成功');return r3.json()}}catch(e3){}
  throw new Error((LANG==='zh'?'所有网络请求失败：':'All network requests failed: ')+errors.slice(-3).join(', '));
}

/* ========== TOAST ========== */
function toast(msg,type){var t=$('toast');t.textContent=msg;t.className='toast toast-'+(type||'info')+' show';clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},4000)}

/* ========== FETCH ========== */
async function fetchEvents(){
  /* 优先读 GitHub Actions 缓存的 data.json（零 CORS） */
  try{
    log(T('tryLocal')||'读取缓存数据...');
    var r=await fetch(DATA_JSON+'?t='+Date.now());  /* 加时间戳防缓存 */
    if(r.ok){
      var data=await r.json();
      if(data&&data.length>0){
        log('✓ '+data.length+(LANG==='zh'?' 条缓存数据':' cached events'));
        $('progBar').style.width='100%';
        return data;
      }
    }
    log('  无缓存数据，尝试 API...',false);
  }catch(e){
    log('  缓存不可用 ('+e.message+')，尝试 API...',false);
  }
  /* 缓存失败时回退到 API + CORS 代理 */
  var all=[],offset=0,limit=100;
  while(true){
    var url=API+'?tag_slug=daily-temperature&limit='+limit+'&closed=false&offset='+offset;
    log(T('fetchingOffset').replace('{n}',offset));
    try{var data=await apiGet(url);}catch(e){log('offset '+offset+' '+e.message,false);break}
    if(!data||!data.length){log('  — done');break}
    var temps=data.filter(function(e){return e.slug&&e.slug.indexOf('highest-temperature')!==-1});
    all=all.concat(temps);
    var pct=Math.min(95,((offset+limit)/200)*100);
    $('progBar').style.width=pct+'%';
    if(data.length<limit){log('  — 末页 (返回'+data.length+'条)');break}
    offset+=limit;if(offset>300)break;
  }
  return all;
}

/* ========== ANALYZE ========== */
function analyze(events){
  var alerts=[],map={},total=0;
  var tv=$('datePicker').value;if(!tv)return{alerts:alerts,map:map,dates:[],total:0};
  var dp=tv.split('-');var tY=parseInt(dp[0]),tM=parseInt(dp[1]),tD=parseInt(dp[2]);
  for(var i=0;i<events.length;i++){
    var ev=events[i],ck=cityKey(ev.slug);if(!ck)continue;
    var dm=slugMonth(ev.slug);
    if(dm&&((dm.month!==tM)||(dm.day!==tD)||(dm.year!==tY)))continue;
    var en=cityEN(ev.slug),zh=cityZH(ev.slug),fl=cityFlag(ev.slug);
    var months=LANG==='zh'?MN_ZH:MN_EN;
    var dt=LANG==='zh'?tY+'年'+tM+'月'+tD+'日':(months[tM]||tM)+' '+tD+', '+tY;
    var settleTs=getSettleUTC(ck,tY,tM,tD);
    if(!map[ev.slug])map[ev.slug]={en:en,zh:zh,dt:dt,fl:fl,slug:ev.slug,ck:ck,settleTs:settleTs,clobTokenIds:ev.clobTokenIds||[],mkts:[],url:ev.url||('https://polymarket.com/event/'+ev.slug)};
    var mkts=ev.markets;if(!mkts||!mkts.length)continue;
    for(var j=0;j<mkts.length;j++){
      var m=mkts[j];if(m.closed)continue;
      total++;var p=parseP(m.outcomePrices);if(!p)continue;
      var mUrl=m.clobTokenIds&&m.clobTokenIds[0]?'https://polymarket.com/event/'+ev.slug+'?token='+m.clobTokenIds[0]:(ev.url||('https://polymarket.com/event/'+ev.slug));
      var mi={title:m.groupItemTitle||m.question,y:p.y,n:p.n,vol:parseFloat(m.volume||0),url:mUrl};
      map[ev.slug].mkts.push(mi);
      var yp=p.y*100,np=p.n*100;
      var yA=yp>=99.66&&yp<=99.71,nA=np>=99.66&&np<=99.71;
      if(yA||nA){var side=yA?'YES':'NO',pct=yA?yp:np;
        alerts.push({en:en,zh:zh,dt:dt,fl:fl,title:mi.title,side:side,pct:pct,yp:yp,np:np,url:mi.url,ck:ck,settleTs:settleTs});
      }
    }
  }
  alerts.sort(function(a,b){return b.pct-a.pct});
  /* 给城市标记最高警报概率，方便排序 */
  var alertCityMax={};
  for(var i=0;i<alerts.length;i++){
    var ak=alerts[i].en;
    if(!alertCityMax[ak]||alerts[i].pct>alertCityMax[ak])alertCityMax[ak]=alerts[i].pct;
  }
  for(var sk in map){
    map[sk]._alertPct=alertCityMax[sk]||0;
    map[sk]._hasAlert=!!alertCityMax[sk];
    /* 计算城市总成交量 */
    var v=0;for(var vi=0;vi<map[sk].mkts.length;vi++)v+=map[sk].mkts[vi].vol||0;
    map[sk]._totalVol=v;
  }
  return{alerts:alerts,map:map,dates:[dt],total:total};
}

/* ========== RENDER ALERTS ========== */
function renderAlerts(alerts){
  var sec=$('alertSec'),list=$('alertList'),badge=$('alertCount'),icon=$('alertIcon');
  if(!alerts.length){sec.style.display='none';return}
  /* 横向单行布局，始终从上到下排列 */
  list.classList.remove('few-alerts');
  sec.style.display='flex';badge.textContent=alerts.length;
  var hasHigh=false;
  for(var i=0;i<alerts.length;i++){if(alerts[i].pct>=99.69){hasHigh=true;break}}
  var lvl=hasHigh?'high':'warn';
  badge.className='alert-badge '+lvl;
  icon.className='alert-icon '+lvl;
  var h='',now=Date.now();
  for(var i=0;i<alerts.length;i++){
    var a=alerts[i],label=getLabel(a.zh,a.en);
    var cls=a.pct>=99.69?'high':'warn';
    var dotIcon=cls==='high'?'🔴':'🟡';
    var remain=fmtRemain(a.settleTs-now);
    var remainColor=a.settleTs-now<=0?'var(--green)':a.settleTs-now<3600000?'var(--red)':'var(--orange)';
    h+='<div class="alert-pair '+cls+'" style="animation-delay:'+i*80+'ms">'
      +'<span class="alert-flag">'+a.fl+'</span>'
      +'<span class="alert-city" title="'+esc(a.en)+'">'+esc(label)+'</span>'
      +'<span class="alert-date">'+a.dt+'</span>'
      +'<span class="dot-icon" style="font-size:10px;flex-shrink:0">'+dotIcon+'</span>'
      +'<span class="alert-tag '+(a.side==='YES'?'yes':'no')+'">'+a.side+'</span>'
      +'<span class="alert-pct" style="color:'+(cls==='high'?'var(--red)':'var(--orange)')+'">'+a.pct.toFixed(2)+'%</span>'
      +'<span class="alert-settle" style="color:'+remainColor+'" data-settle-ts="'+a.settleTs+'">'+remain+'</span>'
      +'<a href="'+a.url+'" target="_blank" rel="noopener" class="alert-pair-link" title="'+esc(a.title)+'">↗ Trade</a>'
    +'</div>';
  }
  list.innerHTML=h;
}

/* ========== RENDER TABLE ========== */
function renderTable(){
  if(!gData)return;
  var cities=Object.values(gData.map);
  /* 排序：有警报的排前面（按警报概率降序），无警报的排后面（字母序） */
  cities.sort(function(a,b){
    if(a._hasAlert&&b._hasAlert)return b._alertPct-a._alertPct;
    if(a._hasAlert)return -1;
    if(b._hasAlert)return 1;
    return a.en.localeCompare(b.en);
  });
  if(gSearch){var s=gSearch.toLowerCase();cities=cities.filter(function(c){return c.en.toLowerCase().indexOf(s)!==-1||(c.zh&&c.zh.indexOf(s)!==-1)})}
  $('rowCount').textContent=cities.length+' '+T('cities');
  var settleLabel=LANG==='zh'?'结算':'Settle';
  $('thead').innerHTML='<tr><th style="width:30px"></th><th>'+T('city')+'</th><th>'+T('option')+'</th><th>'+settleLabel+'</th><th>YES</th><th>NO</th><th>'+T('alert')+'</th><th style="width:40px"></th></tr>';
  var tbody=$('tbody'),h='';var now=Date.now();
  if(!cities.length){
    h='<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text3)">'+T('noMarkets')+'</td></tr>';
  }else{
    for(var i=0;i<cities.length;i++){
      var c=cities[i],label=getLabel(c.zh,c.en);
      var hasAlert=c._hasAlert;
      var remain=fmtRemain(c.settleTs-now);
      var remainColor=c.settleTs-now<=0?'var(--green)':c.settleTs-now<3600000?'var(--red)':'var(--orange)';
      h+='<tr class="city-row'+(hasAlert?' has-alert':'')+'" data-city="'+i+'">'
        +'<td><span class="chevron">▼</span></td>'
        +'<td>'+c.fl+' <a href="'+c.url+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="city-link">'+esc(label)+'</a></td>'
        +'<td style="color:var(--text3)">'+c.mkts.length+' '+T('options')+'</td>'
        +'<td style="color:'+remainColor+';font-family:var(--mono)!important;font-size:12px!important;font-weight:700;white-space:nowrap"><span data-settle-ts="'+c.settleTs+'">'+remain+'</span></td>'
        +'<td></td><td></td>'
        +'<td>'+(hasAlert?'<span class="status-dot alert"></span>':'<span class="status-dot ok"></span>')+'</td>'
      +'</tr>';
      for(var j=0;j<c.mkts.length;j++){
        var m=c.mkts[j];var yp=m.y*100,np=m.n*100;
        var isA=(yp>=99.66&&yp<=99.71)||(np>=99.66&&np<=99.71);
        var side=isA?(yp>=99.66&&yp<=99.71?'YES':'NO'):'-';
        var pct=isA?(yp>=99.66&&yp<=99.71?yp:np).toFixed(2)+'%':'';
        h+='<tr class="mkt-row">'
          +'<td></td><td></td>'
          +'<td style="color:var(--text2)">'+esc(m.title)+'</td>'
          +'<td><span class="bar-wrap"><span class="pct-val" style="color:'+(yp>80?'var(--red)':yp>50?'var(--orange)':'var(--green)')+'">'+fmtPct(m.y)+'%</span><span class="bar bar-yes" style="width:'+Math.max(2,Math.min(yp*0.5,50))+'px"></span></span></td>'
          +'<td><span class="bar-wrap"><span class="pct-val" style="color:'+(np>80?'var(--green)':np>50?'var(--orange)':'var(--red)')+'">'+fmtPct(m.n)+'%</span><span class="bar bar-no" style="width:'+Math.max(2,Math.min(np*0.5,50))+'px"></span></span></td>'
        +'<td>'+(isA?'<span class="status-dot alert"></span><span class="tag '+(yp>=99.66&&yp<=99.71?'tag-yes':'tag-no')+'" style="font-size:9px">'+side+' '+pct+'</span>':'<span class="no-alert-tag">—</span>')+'</td>'
        +'<td><a class="btn-trade" href="'+m.url+'" target="_blank" rel="noopener" title="'+esc(m.title)+'">Trade</a></td>'
      +'</tr>';
      }
    }
  }
  tbody.innerHTML=h;
  initTableClick();
  $('mainContent').style.display='grid';
}

function toggleCity(tr){
  tr.classList.toggle('collapsed');
  var hide=tr.classList.contains('collapsed');
  var next=tr.nextElementSibling;
  while(next && next.classList.contains('mkt-row')){
    next.style.display=hide?'none':'';
    next=next.nextElementSibling;
  }
}

/* ========== VOLUME RANK ========== */
var volRankCollapsed=false;
function toggleVolRank(){
  volRankCollapsed=!volRankCollapsed;
  var list=$('volRankList');
  var btn=$('volRankToggle');
  list.style.display=volRankCollapsed?'none':'flex';
  btn.textContent=volRankCollapsed?(LANG==='zh'?'展开':'Expand'):(LANG==='zh'?'收起':'Collapse');
}
function fmtVol(v){
  if(v>=1000000)return (v/1000000).toFixed(1)+'M';
  if(v>=1000)return (v/1000).toFixed(1)+'K';
  return v.toFixed(0);
}
function renderVolumeRank(){
  if(!gData||!gData.map){$('volRank').style.display='none';return}
  var cities=[];
  for(var sk in gData.map){if(gData.map[sk]._totalVol>0)cities.push(gData.map[sk])}
  if(!cities.length){$('volRank').style.display='none';return}
  cities.sort(function(a,b){return b._totalVol-a._totalVol});
  var topN=cities.slice(0,15);
  var maxVol=topN[0]._totalVol;
  var h='';
  for(var i=0;i<topN.length;i++){
    var c=topN[i],label=getLabel(c.zh,c.en);
    var pct=maxVol>0?Math.round(c._totalVol/maxVol*100):0;
    h+='<div class="vol-rank-item" title="'+esc(label)+': $'+fmtVol(c._totalVol)+'">'
      +'<span class="vol-rank-num">'+(i+1)+'</span>'
      +'<span class="vol-rank-flag">'+c.fl+'</span>'
      +'<span class="vol-rank-city">'+esc(label)+'</span>'
      +'<span class="vol-rank-bar"><span class="vol-rank-bar-fill" style="width:'+pct+'%"></span></span>'
      +'<span class="vol-rank-vol">$'+fmtVol(c._totalVol)+'</span>'
    +'</div>';
  }
  $('volRankList').innerHTML=h;
  $('volRank').style.display='block';
  $('volRankTitle').textContent=LANG==='zh'?'成交量排行':'Volume Rank';
  $('volRankToggle').textContent=LANG==='zh'?'收起':'Collapse';
}
/* tbody 事件委托处理城市行点击 */
function initTableClick(){
  var tbody=$('tbody');
  if(tbody._delegated)return;
  tbody._delegated=true;
  tbody.addEventListener('click',function(e){
    var row=e.target.closest('tr.city-row');
    if(!row)return;
    /* 如果点击的是链接，不折叠 */
    if(e.target.closest('a'))return;
    toggleCity(row);
  });
}
/* 在 renderTable 末尾调用 initTableClick */
function debounceFilter(){clearTimeout(filterTimer);filterTimer=setTimeout(function(){gSearch=$('searchBox').value;renderTable()},150)}

/* ========== SCAN ========== */
async function scan(){
  var btn=$('scanBtn'),ico=$('scanIco'),txt=$('scanTxt');
  btn.disabled=true;ico.innerHTML='<div class="spin"></div>';txt.textContent=T('scanning');
  $('emptyState').style.display='none';$('stats').style.display='grid';
  $('prog').classList.add('on');$('progBar').style.width='3%';$('logPanel').innerHTML='';
  var t0=Date.now();
  try{
    log(T('scanStart'));
    var events=await fetchEvents();
    log(T('scanFetched').replace('{n}',events.length));
    $('progBar').style.width='97%';
    gData=analyze(events);gData._raw=events;
    var nc=Object.keys(gData.map).length;
    log(T('scanDone').replace('{c}',nc).replace('{m}',gData.total).replace('{a}',gData.alerts.length));
    animateNum($('sCity'),nc);animateNum($('sMkt'),gData.total);animateNum($('sAlert'),gData.alerts.length);
    $('sTime').textContent=((Date.now()-t0)/1000).toFixed(1)+'s';$('progBar').style.width='100%';
    renderAlerts(gData.alerts);renderTable();renderVolumeRank();startSettleTimer();
    setTimeout(function(){$('prog').classList.remove('on')},600);
    if(gData.alerts.length){toast(T('alertFound').replace('{n}',gData.alerts.length),'error');playSound()}
    else{toast(T('noAlert').replace('{c}',nc),'ok')}
  }catch(err){toast(T('scanFail')+': '+err.message,'error');log('ERROR: '+err.message,true);$('prog').classList.remove('on')}
  btn.disabled=false;ico.innerHTML='⚡';txt.textContent=T('scan');
  if(autoTimer)autoCountdown=600;
}

/* ========== AUTO SCAN (10分钟) ========== */
var autoTimer=null,autoCountdown=0;
function toggleAuto(){
  var btn=$('autoBtn');
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;btn.classList.remove('on');btn.textContent='10m';return}
  btn.classList.add('on');
  autoCountdown=600;
  function tick(){
    autoCountdown--;
    if(autoCountdown<=0){scan();autoCountdown=600}
    var m=Math.floor(autoCountdown/60),s=autoCountdown%60;
    btn.textContent=(m>0?m+'m':'')+s+'s';
  }
  tick();
  autoTimer=setInterval(tick,1000);
}

/* ========== SOUND ========== */
function playSound(){
  try{var ctx=new(window.AudioContext||window.webkitAudioContext)();
  var notes=[523,659,784,1047];
  for(var i=0;i<notes.length;i++){var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
    o.frequency.setValueAtTime(notes[i],ctx.currentTime+i*.12);o.type='sine';
    g.gain.setValueAtTime(.15,ctx.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+i*.12+.15);
    o.start(ctx.currentTime+i*.12);o.stop(ctx.currentTime+i*.12+.15)}
  }catch(e){}
}

/* ========== FONT SIZE ========== */
var gFontSize=100;
function changeFontSize(dir){
  gFontSize=Math.max(70,Math.min(150,gFontSize+dir*5));
  document.documentElement.style.fontSize=gFontSize+'%';
  $('fontSizeVal').textContent=gFontSize+'%';
  try{localStorage.setItem('pw_alert_fontsize',gFontSize)}catch(e){}
}
(function(){
  try{
    var s=localStorage.getItem('pw_alert_fontsize');
    if(s){gFontSize=parseInt(s);if(isNaN(gFontSize))gFontSize=100;}
    document.documentElement.style.fontSize=gFontSize+'%';
    document.addEventListener('DOMContentLoaded',function(){$('fontSizeVal').textContent=gFontSize+'%'});
  }catch(e){}
})();

  $('lblAlerts').textContent=T('alerts');$('lblTime').textContent=T('time');

/* ========== QUICK DATES ========== */
function initQuickDates(){
  var now=new Date(),bar=$('quickDates'),h='';
  var labels=[T('today'),T('tomorrow'),T('dayAfter')];
  for(var i=0;i<=2;i++){
    var d=new Date(now);d.setDate(d.getDate()+i);
    var val=fmtDate(d.getFullYear(),d.getMonth()+1,d.getDate());
    h+='<span class="qdate'+(i===0?' on':'')+'" data-val="'+val+'" onclick="pickQuick(this,\''+val+'\')">'+labels[i]+'</span>';
  }
  bar.innerHTML=h;
}
function pickQuick(el,val){
  document.querySelectorAll('.qdate').forEach(function(q){q.classList.remove('on')});
  el.classList.add('on');$('datePicker').value=val;
}

/* ========== KEYBOARD SHORTCUTS ========== */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();scan()}
  if(e.key==='l'||e.key==='L')toggleLog();
  if(e.key==='a'||e.key==='A')toggleAuto();
});

/* ========== INIT ========== */
(function(){
  var now=new Date(),tm=new Date(now);
  $('datePicker').value=fmtDate(tm.getFullYear(),tm.getMonth()+1,tm.getDate());
  initQuickDates();applyLang();
})();
</script>
